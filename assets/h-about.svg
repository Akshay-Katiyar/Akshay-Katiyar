<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="GHOST" shape-rendering="crispEdges">
  <defs>
    <style>
      @keyframes ghost-bob {
        0%, 100% { transform: translateY(0px); }
        50%      { transform: translateY(-3.5px); }
      }
      @keyframes ghost-blink {
        0%, 90%, 94%, 100% { transform: scaleY(1); }
        92%                { transform: scaleY(0.1); }
      }
      .ghost-float {
        animation: ghost-bob 2.2s ease-in-out infinite;
        transform-origin: 24px 24px;
        filter: drop-shadow(0 0 4px rgba(0, 240, 255, 0.70));
      }
      .ghost-eyes {
        animation: ghost-blink 4.2s ease-in-out infinite;
        transform-origin: 24px 19px;
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
  </defs>
  <g class="ghost-float">
    <!-- Main Sheet Body -->
    <rect x="18" y="8" width="12" height="2" fill="#FDFBF2"/>
    <rect x="15" y="10" width="18" height="2" fill="#FDFBF2"/>
    <rect x="13" y="12" width="22" height="3" fill="#FDFBF2"/>
    <!-- Upper Body and Arm Stubs -->
    <rect x="12" y="15" width="24" height="6" fill="#FDFBF2"/>
    <rect x="9" y="19" width="4" height="5" rx="1" fill="#FDFBF2"/>
    <rect x="35" y="19" width="4" height="5" rx="1" fill="#FDFBF2"/>
    <!-- Mid Torso -->
    <rect x="13" y="21" width="22" height="11" fill="#FDFBF2"/>
    
    <!-- Shadow / Fold Depth -->
    <rect x="13" y="32" width="22" height="4" fill="#E2DCBA"/>
    <!-- Ruffled Skirt Hem -->
    <rect x="13" y="36" width="3" height="3" fill="#FDFBF2"/>
    <rect x="17" y="36" width="4" height="2" fill="#FDFBF2"/>
    <rect x="22" y="36" width="4" height="3" fill="#FDFBF2"/>
    <rect x="27" y="36" width="4" height="2" fill="#FDFBF2"/>
    <rect x="32" y="36" width="3" height="3" fill="#FDFBF2"/>

    <!-- Bottom Hem Shadows -->
    <rect x="16" y="36" width="1" height="2" fill="#C5BD95"/>
    <rect x="21" y="36" width="1" height="2" fill="#C5BD95"/>
    <rect x="26" y="36" width="1" height="2" fill="#C5BD95"/>
    <rect x="31" y="36" width="1" height="2" fill="#C5BD95"/>

    <!-- Cute Ghost Face -->
    <g class="ghost-eyes">
      <rect x="19" y="17" width="2.5" height="4" rx="1" fill="#151821"/>
      <rect x="19" y="17" width="1" height="1.5" fill="#ffffff"/>
      <rect x="27" y="17" width="2.5" height="4" rx="1" fill="#151821"/>
      <rect x="27" y="17" width="1" height="1.5" fill="#ffffff"/>
      <path d="M 22 23 Q 24 25 26 23" stroke="#151821" stroke-width="1.2" stroke-linecap="round" fill="none"/>
      <rect x="16" y="21" width="2" height="1.5" rx="0.5" fill="#f87171" opacity="0.6"/>
      <rect x="30" y="21" width="2" height="1.5" rx="0.5" fill="#f87171" opacity="0.6"/>
    </g>
  </g>
</svg>