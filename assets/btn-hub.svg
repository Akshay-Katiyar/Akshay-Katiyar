  <rect x="0" y="8" width="4" height="48" fill="#f4f4f4"/>
  <rect x="216" y="8" width="4" height="48" fill="#f4f4f4"/>
  <rect x="4" y="4" width="4" height="4" fill="#f4f4f4"/>
  <rect x="212" y="4" width="4" height="4" fill="#f4f4f4"/>
  <rect x="4" y="56" width="4" height="4" fill="#f4f4f4"/>
  <rect x="212" y="56" width="4" height="4" fill="#f4f4f4"/>
  <g transform="translate(16, 0)">
    <g transform="translate(0, 0)">
      
  <rect x="0" y="16" width="32" height="32" rx="4" fill="#6366F1"/>
  <rect x="14" y="18" width="4" height="3" fill="#A5B4FC"/>
  <rect x="6" y="21" width="20" height="18" rx="2" fill="#E0E7FF"/>
  <rect x="9" y="26" width="4" height="4" fill="#4F46E5"/>
  <rect x="19" y="26" width="4" height="4" fill="#4F46E5"/>
