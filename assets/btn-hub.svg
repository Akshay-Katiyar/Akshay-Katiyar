<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64" width="220" height="64" role="img" aria-label="AI Agent Hub" shape-rendering="crispEdges">
  <title>AI Agent Hub</title>
  <defs>
    <style>
      text { shape-rendering: auto; font-variant-ligatures: none; font-feature-settings: 'liga' 0, 'calt' 0; }
      @font-face{font-family:'N';src:url(data:font/woff2;base64,) format('woff2');}
      .l { font: 700 24px N; fill: #f4f4f4; }
      .nx { animation: nx 1.4s ease-in-out infinite; }
      @keyframes nx {
        0%, 100% { transform: translateX(0); }
        50%      { transform: translateX(5px); }
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
  </defs>
  <rect x="4" y="4" width="212" height="56" fill="#1a1c2c"/>
