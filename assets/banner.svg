<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090D"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#141923"/>
    </linearGradient>

    <!-- Neon Accents -->
    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#7928CA"/>
      <stop offset="100%" stop-color="#FF0080"/>
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="line-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#7928CA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF0080" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363D" stroke-width="0.75" stroke-opacity="0.35"/>
      <circle cx="40" cy="40" r="1" fill="#58A6FF" fill-opacity="0.3"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 900; letter-spacing: -1.5px; fill: #FFFFFF; }
    .tagline { font-weight: 500; letter-spacing: 2.5px; fill: #00F0FF; font-size: 13px; text-transform: uppercase; }
    .status-text { font-size: 12px; fill: #8B949E; letter-spacing: 1.5px; font-weight: 600; text-transform: uppercase; }
    .hud-title { font-size: 11px; fill: #58A6FF; font-weight: 700; letter-spacing: 1px; }
    .hud-val { font-size: 13px; fill: #F0F6FC; font-weight: 600; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="380" rx="16" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="#30363D" stroke-width="1.5" stroke-opacity="0.8"/>
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#cyan-violet)"/>

  <!-- Glowing Corner Accents -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#00F0FF" stroke-width="2.5" opacity="0.8"/>
  <path d="M 1180 50 L 1180 20 L 1150 20" fill="none" stroke="#7928CA" stroke-width="2.5" opacity="0.8"/>
  <path d="M 20 330 L 20 360 L 50 360" fill="none" stroke="#00F0FF" stroke-width="2.5" opacity="0.8"/>
  <path d="M 1180 330 L 1180 360 L 1150 360" fill="none" stroke="#FF0080" stroke-width="2.5" opacity="0.8"/>

  <!-- Top System Telemetry Bar -->
  <g transform="translate(60, 48)">
    <rect width="360" height="28" rx="14" fill="url(#badge-grad)" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="16" cy="14" r="5" fill="#00FF88" filter="url(#glow)"/>
    <text x="32" y="18" class="mono status-text" fill="#00FF88" font-size="11">SYSTEM ACTIVE // COGNITIVE NODE: 0xGHOST</text>
  </g>

  <g transform="translate(860, 48)">
    <text x="280" y="18" class="mono status-text" text-anchor="end" fill="#8B949E">LATENCY: &lt;1.2MS // EDGE OPTIMIZED</text>
  </g>

  <!-- Divider Line with Glow -->
  <line x1="60" y1="92" x2="1140" y2="92" stroke="url(#line-glow)" stroke-width="2"/>

  <!-- Main Hero Title Section -->
  <g transform="translate(60, 160)">
    <text x="0" y="0" class="sans title" font-size="62">AKSHAY KATIYAR</text>
    <text x="590" y="-8" class="mono" font-size="24" fill="#7928CA" font-weight="700">::</text>
    <text x="615" y="-8" class="mono" font-size="24" fill="#00F0FF" font-weight="700">GHOST</text>
    <text x="0" y="38" class="mono tagline">AUTONOMOUS SYSTEMS ARCHITECT // AI AGENT SWARMS // CROSS-PLATFORM FOUNDER</text>
  </g>

  <g transform="translate(60, 230)">
    <text x="0" y="0" class="sans" font-size="15" fill="#8B949E" font-weight="400">
      Engineering high-agency multi-agent swarms, statutory legal engines (19,849+ Bare Acts), 3D WebGL experiences, and 30+ native Flutter applications.
    </text>
  </g>

  <!-- Bottom HUD Metrics Deck -->
  <g transform="translate(60, 275)">
    <!-- Metric 1: Legal AI -->
    <rect x="0" y="0" width="250" height="64" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <path d="M 0 10 L 0 54" stroke="#00F0FF" stroke-width="3" stroke-linecap="round"/>
    <text x="16" y="24" class="mono hud-title">LEGAL AI ENGINE</text>
    <text x="16" y="47" class="mono hud-val">19,849+ Bare Acts (BNS/BNSS)</text>

    <!-- Metric 2: Production Apps -->
    <rect x="275" y="0" width="250" height="64" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <path d="M 275 10 L 275 54" stroke="#7928CA" stroke-width="3" stroke-linecap="round"/>
    <text x="291" y="24" class="mono hud-title">CROSS-PLATFORM FORGE</text>
    <text x="291" y="47" class="mono hud-val">30+ Native Apps Shipped</text>

    <!-- Metric 3: Agent Swarms -->
    <rect x="550" y="0" width="250" height="64" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <path d="M 550 10 L 550 54" stroke="#00FF88" stroke-width="3" stroke-linecap="round"/>
    <text x="566" y="24" class="mono hud-title">AGENT ARCHITECTURE</text>
    <text x="566" y="47" class="mono hud-val">Multi-Agent Swarm Loops</text>

    <!-- Metric 4: WebGL & Motion -->
    <rect x="825" y="0" width="255" height="64" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <path d="M 825 10 L 825 54" stroke="#FF0080" stroke-width="3" stroke-linecap="round"/>
    <text x="841" y="24" class="mono hud-title">3D &amp; DESIGN SYSTEM</text>
    <text x="841" y="47" class="mono hud-val">Three.js + GSAP Scrolly</text>
  </g>
</svg>
