<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 165 64" width="165" height="64" role="img" aria-label="YouTube" shape-rendering="crispEdges">
  <title>YouTube</title>
  <defs>
    <style>
      text { shape-rendering: auto; font-variant-ligatures: none; font-feature-settings: 'liga' 0, 'calt' 0; }
      @font-face{font-family:'N';src:url(data:font/woff2;base64,) format('woff2');}
      .l { font: 700 24px N; fill: #f4f4f4; }
      .nx { animation: nx 1.4s ease-in-out infinite; }
      @keyframes nx {
        0%, 100% { transform: translateX(0); }
        50%      { transform: translateX(5px); }
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
  </defs>
  <rect x="4" y="4" width="157" height="56" fill="#1a1c2c"/>
  <rect x="6" y="6" width="153" height="3" fill="#2a2e45" opacity="0.6"/>
  <rect x="8" y="0" width="149" height="4" fill="#f4f4f4"/>
  <rect x="8" y="60" width="149" height="4" fill="#f4f4f4"/>
  <rect x="0" y="8" width="4" height="48" fill="#f4f4f4"/>
  <rect x="161" y="8" width="4" height="48" fill="#f4f4f4"/>
  <rect x="4" y="4" width="4" height="4" fill="#f4f4f4"/>
  <rect x="157" y="4" width="4" height="4" fill="#f4f4f4"/>
  <rect x="4" y="56" width="4" height="4" fill="#f4f4f4"/>
  <rect x="157" y="56" width="4" height="4" fill="#f4f4f4"/>
  <g transform="translate(16, 0)">
    <g transform="translate(0, 0)">
      
  <rect x="0" y="18" width="34" height="28" rx="6" fill="#FF0000"/>
  <polygon points="14,24 24,32 14,40" fill="#ffffff"/>

    </g>
    <text x="44" y="41" class="l">YouTube</text>
  </g>
  
</svg>