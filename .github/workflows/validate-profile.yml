name: Validate Profile README & Badges

on:
  push:
    paths:
      - 'README.md'
      - 'templates/**'
      - 'scripts/**'
  pull_request:
    paths:
      - 'README.md'
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday run at 06:00 UTC
  workflow_dispatch:

concurrency:
  group: profile-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Verify Markdown, Links, & Syntax
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run PowerShell Validation Suite (Offline & Local Assets)
        shell: pwsh
        run: |
          ./scripts/validate-profile-badges.ps1 -RepoRoot "." -TargetFiles @("README.md", "templates/*.md") -Strict
